# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review settings. AGENTS.md and similar guideline files are read as the coding guidelines.
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    ignore_usernames:
      - dependabot[bot]
  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
  pre_merge_checks:
    title:
      mode: warning
    description:
      mode: warning
  path_filters:
    - "!.idea/**"
    - "!composer.lock"
    - "!vendor/**"
    - "!tests/temp/**"
  path_instructions:
    - path: "src/**/*.php"
      instructions: "Nette DI library wrapping the Mailchimp API. Check request/response handling in Request.php, HTTP error mapping to the Exception classes, and that the API key is never logged or exposed in exception messages."
    - path: "src/DI/**"
      instructions: "Check extension config schema, defaults and service registration stay backward compatible for existing Nette apps."
    - path: "tests/**"
      instructions: "Nette Tester tests. Integration tests take credentials from the MAILCHIMP_API_KEY and MAILCHIMP_TEST_LIST environment variables (as CI does) or from the optional tests/config/config.local.neon, and must skip cleanly when neither provides them. Unit tests must never call the real Mailchimp API."
knowledge_base:
  code_guidelines:
    enabled: true
chat:
  auto_reply: true
